<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New tab</title>
  <style>
    @font-face { font-family: Manrope; font-weight: 200 800; src: url("Manrope.ttf") format("truetype"); }
    :root { --ink: #1f2024; --muted: #8a8690; --paper: #fbfaf7; --tint: #d08a52; --accent: #9a5424; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: Manrope, "Segoe UI", sans-serif; color: var(--ink); }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    .g { font: normal 16px/1 "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
    .page { height: 100%; overflow: auto; padding: 56px clamp(28px, 6vw, 104px); }
    .page.start { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 72px; background: linear-gradient(180deg, var(--paper), color-mix(in srgb, var(--tint) 9%, var(--paper))); }
    .ask { width: min(560px, 100%); margin: 0 0 6vh; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px rgba(31,32,36,.06), 0 10px 30px color-mix(in srgb, var(--tint) 14%, transparent); }
    .ask .line { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; color: var(--muted); }
    .ask .line .g { font-size: 14px; }
    .ask input { flex: 1; min-width: 0; border: 0; outline: 0; padding: 0; background: transparent; font: 500 15px Manrope, "Segoe UI", sans-serif; color: var(--ink); }
    .ask input::placeholder { color: #a09ea7; }
    .ask .tools { display: flex; align-items: center; gap: 6px; padding: 4px 8px 8px 10px; }
    .ask .attach { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 8px; color: #75737c; font-size: 12.5px; }
    .ask .attach .g { font-size: 12px; }
    .ask .attach:hover { background: rgba(31,32,36,.05); }
    .ask .send { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--tint) 22%, #fff); color: var(--accent); }
    .ask .send .g { font-size: 13px; }
    .ask .send.ready { background: var(--accent); color: #fff; }
    .sky-mark { width: 76px; height: 76px; margin: 0 0 22px; overflow: visible; filter: drop-shadow(0 10px 18px color-mix(in srgb, var(--tint) 16%, transparent)); }
    .sky-top { stop-color: color-mix(in srgb, var(--tint) 16%, #fff); }
    .sky-low { stop-color: color-mix(in srgb, var(--tint) 48%, var(--paper)); }
    .workspace-info { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 6px; color: #8d8b94; font-size: 12px; pointer-events: none; }
    .workspace-info b { color: #5d5b64; font-weight: 600; }
  </style>
</head>
<body>
  <main class="page start">
    <svg class="sky-mark" viewBox="0 0 96 96" aria-hidden="true">
      <defs>
        <clipPath id="rivet-silhouette"><circle cx="44" cy="44" r="32"/><path d="M58 49 L83 74 L74 83 L49 58 Z"/><circle cx="78.5" cy="78.5" r="6.4"/></clipPath>
        <linearGradient id="sky-fill" x1="0" y1="0" x2=".3" y2="1"><stop class="sky-top" offset="0"/><stop class="sky-low" offset="1"/></linearGradient>
      </defs>
      <g clip-path="url(#rivet-silhouette)"><rect width="96" height="96" fill="url(#sky-fill)"/></g>
    </svg>
    <form class="ask">
      <label class="line"><i class="g" aria-hidden="true">&#xE721;</i><input class="ask-input" aria-label="Search or ask Rivet" placeholder="Search or ask Rivet" autocomplete="off"></label>
      <div class="tools">
        <button class="attach" type="button"><i class="g" aria-hidden="true">&#xE710;</i>Add tabs or files</button>
        <button class="send" type="submit" title="Send (Enter)" aria-label="Send"><i class="g" aria-hidden="true">&#xE74A;</i></button>
      </div>
    </form>
    <div class="workspace-info">Opened in <b><span class="browser">Chrome</span> · <span class="profile">Work</span></b></div>
  </main>
  <script>
    function addressFor(value) {
      const input = value.trim();
      if (input.includes('://') || input.startsWith('about:')) return input;
      if (!/\s/u.test(input) && (input.includes('.') || input.startsWith('localhost'))) return 'https://' + input;
      let query = '';
      for (const byte of new TextEncoder().encode(input)) {
        if ((byte >= 65 && byte <= 90) || (byte >= 97 && byte <= 122) || (byte >= 48 && byte <= 57) || [45, 95, 46, 126].includes(byte)) query += String.fromCharCode(byte);
        else if (byte === 32) query += '+';
        else query += '%' + byte.toString(16).toUpperCase().padStart(2, '0');
      }
      return 'https://www.google.com/search?q=' + query;
    }
    const input = document.querySelector('.ask-input');
    const send = document.querySelector('.send');
    const params = new URLSearchParams(location.search);
    document.querySelector('.browser').textContent = params.get('browser') || 'Chrome';
    document.querySelector('.profile').textContent = params.get('profile') || params.get('space') || 'Work';
    input.addEventListener('input', () => send.classList.toggle('ready', !!input.value.trim()));
    document.querySelector('.ask').addEventListener('submit', event => {
      event.preventDefault();
      if (input.value.trim()) location.href = addressFor(input.value);
    });
  </script>
</body>
</html>
