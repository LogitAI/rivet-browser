# Tests the row finder on browser builds as their makers release them.
#
# Rivet finds the values of a row in the installed browser's own binary, by the descriptions in
# rivet/platform/windows/rows/descriptions.json. This job only measures that finder. Once a day it
# reads what Chrome, Edge and Brave publish, takes the newest stable builds that have no verified
# row, runs `chrome-builds find` on each and uploads how many values it found and did not find, per
# feature. It makes no row, signs nothing, publishes nothing and opens no pull request.
#
# A run started by hand with `score` runs the finder on builds that have a verified row and are
# still downloadable, and compares every value it found with that row. It fails when a found value
# is wrong. A value not found is reported, not a failure.
#
# No browser's debug symbols are downloaded or read.
name: Browser rows

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      score:
        description: "Score the finder on builds with a verified row, as browser@version separated by semicolons, or 'default' for scripts/tests/row-score.ps1's list. Leave empty to test the newest releases."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: browser-rows
  cancel-in-progress: false

env:
  # Each build is a download of hundreds of megabytes, and a run does no more than this many builds.
  MOST_PER_RUN: "3"

jobs:
  watch:
    name: Find new builds
    if: github.event.inputs.score == ''
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      builds: ${{ steps.pending.outputs.builds }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the row tools
        working-directory: rivet
        run: cargo build --release -p rivet-platform-windows -p rivet-runtime-windows --bins

      - uses: actions/upload-artifact@v4
        with:
          name: row-tools
          path: |
            rivet/target/release/chrome-builds.exe
            rivet/target/release/rivet-rows.exe
          retention-days: 1

      - name: Read what the makers publish
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $feeds = Join-Path $env:RUNNER_TEMP "feeds"
          New-Item -ItemType Directory -Force $feeds | Out-Null
          $history = "https://versionhistory.googleapis.com/v1/chrome/platforms/win64/channels"
          curl.exe -fsSL -o "$feeds/chrome-stable.json" "$history/stable/versions/all/releases?filter=endtime=none"
          curl.exe -fsSL -o "$feeds/chrome-beta.json" "$history/beta/versions?pageSize=5"
          curl.exe -fsSL -o "$feeds/edge.json" "https://edgeupdates.microsoft.com/api/products?view=enterprise"
          gh api "repos/brave/brave-browser/releases?per_page=40" > "$feeds/brave.json"
          $tools = "rivet/target/release"
          & "$tools/rivet-rows.exe" known --table rivet/runtime/windows/rows/table.json | Set-Content "$feeds/known.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tools/chrome-builds.exe" pending "$feeds/chrome-stable.json" "$feeds/chrome-beta.json" "$feeds/edge.json" "$feeds/brave.json" "$feeds/known.json" | Set-Content "$feeds/pending.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$feeds/pending.json"
          # The newest stable build of each browser that people have now.
          $listed = @(Get-Content -Raw "$feeds/pending.json" | ConvertFrom-Json)
          $builds = @($listed | Where-Object { $_.channel -eq 'stable' -and $_.serving } |
            Group-Object browser | ForEach-Object {
              $_.Group | Sort-Object { [version]$_.version } -Descending | Select-Object -First 1
            } | Select-Object -First ([int]$env:MOST_PER_RUN))
          # Through the pipeline: -InputObject would wrap the whole list as one element of another list.
          $json = if ($builds.Count) { $builds | ConvertTo-Json -Compress -AsArray } else { "[]" }
          "builds=$json" >> $env:GITHUB_OUTPUT

  find:
    name: Find rows in ${{ matrix.build.browser }} ${{ matrix.build.version }}
    needs: watch
    if: needs.watch.outputs.builds != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        build: ${{ fromJson(needs.watch.outputs.builds) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: row-tools
          path: tools

      - name: Get the build
        id: build
        run: |
          ./.github/scripts/rows/fetch-browser.ps1 `
            -Browser "${{ matrix.build.browser }}" -Version "${{ matrix.build.version }}" `
            -Channel "${{ matrix.build.channel }}" -Download "${{ matrix.build.download }}" `
            -Out (Join-Path $env:RUNNER_TEMP "browser") -Output $env:GITHUB_OUTPUT

      - name: Run the finder on the build
        run: |
          ./tools/chrome-builds.exe find "${{ steps.build.outputs.module }}" "${{ matrix.build.version }}" (Join-Path $env:RUNNER_TEMP "report.json")
          if ($LASTEXITCODE -ne 0) { throw "chrome-builds find exited with $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finder-${{ matrix.build.browser }}-${{ matrix.build.version }}
          path: ${{ runner.temp }}/report.json
          retention-days: 30

  score:
    name: Score the finder against verified rows
    if: github.event.inputs.score != ''
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build the row tools
        working-directory: rivet
        run: cargo build --release -p rivet-platform-windows -p rivet-runtime-windows --bins

      - name: Find each build's values and compare them with its verified row
        env:
          SCORE: ${{ github.event.inputs.score }}
        run: |
          $builds = if ($env:SCORE -eq 'default') { @() } else { @($env:SCORE -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ }) }
          ./scripts/tests/row-score.ps1 `
            -Rows rivet/target/release/rivet-rows.exe -Finder rivet/target/release/chrome-builds.exe `
            -Table rivet/runtime/windows/rows/table.json -Builds $builds -Fetch `
            -Work (Join-Path $env:RUNNER_TEMP "score")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: row-score
          path: ${{ runner.temp }}/score/*.json
          retention-days: 30
