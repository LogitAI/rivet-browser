# The fast quality gate. Runs on every pull request, whatever its base.
#
# The repository checks (the planning documents are present on develop, no em dashes,
# README files do not link documents that main does not have, and the release sync script
# behaves. The first Rust crate adds the Rust build and test job with its requirement-named tests.

name: Test

on:
  # Every pull request, whatever its base. Work lands on develop through pull requests,
  # and the release pull request into main is gated by the same run.
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  repository:
    name: Check the repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release sync test builds throwaway repositories; it needs git, not history.
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run the repository checks
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          ./scripts/check.sh

  rust:
    name: Test the Rust code (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rivet
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the tests
        run: cargo test --workspace

